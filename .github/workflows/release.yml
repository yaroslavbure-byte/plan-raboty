# Выпуск версии: поднять "version" в package.json и запушить в main — релиз vX.Y.Z создаётся сам.
#  • windows  — собирает установщик и публикует GitHub Release → приложение само скачивает обновление
#  • database — (если задан секрет SUPABASE_DB_URL) применяет supabase/migrations/*.sql
# Сайт для телефона собирает Netlify сам при push в main (см. netlify.toml).
name: release
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "SUPABASE_DB_URL не задан — пропускаю"; exit 0; fi
          for f in supabase/migrations/*.sql; do echo "== $f"; psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; echo "Релиз v$V уже есть — пропускаю"; fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists != '1'
        with: { node-version: 20, cache: npm }
      - run: npm ci
        if: steps.v.outputs.exists != '1'
      - name: Build installer
        if: steps.v.outputs.exists != '1'
        shell: bash
        run: |
          eval "$(grep -E '^\s*VITE_SUPABASE_(URL|ANON_KEY)' netlify.toml | sed -E 's/^\s*(\w+) = (.*)$/export \1=\2/')"
          export VITE_UPDATE_FEED="https://github.com/${{ github.repository }}/releases/latest/download"
          npm run build
          npx electron-builder --win --x64 --publish never
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists != '1'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: План работы ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            release/latest.yml
            release/*.exe
            release/*.blockmap
