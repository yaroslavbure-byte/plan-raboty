# Netlify собирает сайт для телефона из этого репозитория при каждом push в main.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
  # Публичный (publishable) ключ — он и так виден в браузере; данные защищены RLS.
  VITE_SUPABASE_URL = "https://oqdmpacgpdowkupjwkmu.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_3-IZL9R4rHAX2oRrNZp7UA_pEL9DVT-"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
